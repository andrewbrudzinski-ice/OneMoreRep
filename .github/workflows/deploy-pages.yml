name: Deploy to GitHub Pages

# Auto-deploys on every push to main, and can be run manually. The
# `enablement: true` below turns Pages on (Actions source) the first time it
# runs, so there's no manual Settings step to get wrong.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Project Pages serve at /<repo>/ — build with that as the base so asset
      # URLs and the router basename line up. Derived from GITHUB_REPOSITORY so
      # it's correct regardless of the triggering event.
      - name: Build (subpath base for Project Pages)
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          echo "Building with base /$REPO_NAME/"
          VITE_BASE="/$REPO_NAME/" npm run build

      - name: SPA fallback for client-side routes (deep links / refresh)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
