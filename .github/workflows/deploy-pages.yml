name: Deploy to GitHub Pages

# Auto-deploys on every push to the repo's default branch (currently
# claude/new-session-0zts34; `main` kept for when it's renamed), and can be run
# manually. The `enablement: true` below turns Pages on (Actions source) the
# first time it runs, so there's no manual Settings step to get wrong.
on:
  push:
    branches: [main, claude/new-session-0zts34]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deploys. cancel-in-progress must be FALSE: a cancelled run
# can leave its server-side Pages deployment mid-flight, which then makes the
# next run fail with "deployment already in progress". Letting each deploy
# finish (and queuing the next) is GitHub's recommended setting and avoids that
# race — the cost is at most one superseded run waiting briefly.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Project Pages serve at /<repo>/ — build with that as the base so asset
      # URLs and the router basename line up. Derived from GITHUB_REPOSITORY so
      # it's correct regardless of the triggering event.
      - name: Build (subpath base for Project Pages)
        env:
          # Personal USDA FoodData Central key (raises the food-search rate limit
          # above the shared DEMO_KEY). A secret takes precedence if one is set.
          # This is a client-side, public-by-design key — it's inlined into the
          # bundle regardless — and is free/revocable at api.data.gov.
          VITE_USDA_API_KEY: ${{ secrets.VITE_USDA_API_KEY || 'IHZqgRtK4gWxtsV0NPtW7xXgElcY3AHjcLLRVBCZ' }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          echo "Building with base /$REPO_NAME/"
          VITE_BASE="/$REPO_NAME/" npm run build

      - name: SPA fallback for client-side routes (deep links / refresh)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
